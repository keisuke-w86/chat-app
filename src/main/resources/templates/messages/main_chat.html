<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
  <div th:fragment="main_chat">
    <div class="main_chat">
      <div class="main_chat_header">
        <div class="about-chat-room" th:text="${room.name}"></div>
        <a href="#" class="exit-chat">チャットを終了する</a>
      </div>

      <div class="main_chat_body">
        <div class="message-container" th:each="message : ${messages}">
          <div class="message">
            <div class="message-sender" th:text="${message.user.username}">
              ユーザ名
            </div>
            <div
              class="when"
              th:text="${#dates.format(message.createdAt, 'yyyy/MM/dd HH:mm:ss')}"
            ></div>
          </div>
          <div class="message-text" th:text="${message.content}">
            メッセージ内容
          </div>
          <img
            th:src="@{${message.image}}"
            alt="メッセージ画像"
            style="width: 500px; height: 500px"
          />
        </div>
      </div>

      <form
        th:action="@{/rooms/{roomId}/messages(roomId=${room.id})}"
        method="post"
        th:object="${messageForm}"
        class="form"
        enctype="multipart/form-data"
      >
        <input
          type="text"
          th:field="*{content}"
          class="message-input"
          placeholder="type a message"
        />

        <label class="form-image">
          <span class="image-file">画像</span>
          <input type="file" class="hidden" th:field="*{image}" />
        </label>
        <input type="submit" class="send-message" value="送信" />
      </form>
    </div>
  </div>
</html>
